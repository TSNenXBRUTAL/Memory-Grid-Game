<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Memory Grid Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      margin-top: 30px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(6, 60px);
      grid-gap: 10px;
      justify-content: center;
      margin: 20px auto;
    }
    .cell {
      width: 60px;
      height: 60px;
      background-color: #1e1e1e;
      border: 2px solid #00bfff;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .highlight {
      background-color: #5dbcd2;
    }
    .correct {
      background-color: #4CAF50;
    }
    .wrong {
      background-color: #E53935;
    }
    .stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-bottom: 10px;
      font-size: 1.2em;
    }
  </style>
</head>
<body>

<h2>🧠 Memory Game</h2>
<p>Memorize the blue boxes for <strong>5 seconds</strong>, then tap them!</p>

<div class="stats">
  <div>✅ Score: <span id="score">0</span></div>
  <div>📦 Remaining: <span id="remaining">0</span></div>
  <div>❌ Wrong Taps: <span id="wrongTaps">0</span></div>
</div>

<div class="grid" id="grid"></div>

<script>
  const grid = document.getElementById("grid");
  const scoreDisplay = document.getElementById("score");
  const remainingDisplay = document.getElementById("remaining");
  const wrongTapsDisplay = document.getElementById("wrongTaps");

  const gridSize = 6;
  const totalBoxes = gridSize * gridSize;
  const boxesToHighlight = 10;
  const maxWrongTaps = 3;
  let highlighted = [];
  let score = 0;
  let wrongTaps = 0;
  let canClick = false;

  // Create grid
  for (let i = 0; i < totalBoxes; i++) {
    const cell = document.createElement("div");
    cell.classList.add("cell");
    cell.dataset.index = i;
    grid.appendChild(cell);
  }

  function getRandomBoxes() {
    const indices = new Set();
    while (indices.size < boxesToHighlight) {
      indices.add(Math.floor(Math.random() * totalBoxes));
    }
    return Array.from(indices);
  }

  function updateStats() {
    scoreDisplay.textContent = score;
    remainingDisplay.textContent = highlighted.length;
    wrongTapsDisplay.textContent = wrongTaps;
  }

  function endGame(message) {
    alert(message);
    canClick = false;
    setTimeout(() => location.reload(), 1000);
  }

  function startGame() {
    highlighted = getRandomBoxes();
    updateStats();
    const cells = document.querySelectorAll(".cell");

    // Highlight selected cells
    highlighted.forEach(i => {
      cells[i].classList.add("highlight");
    });

    // Remove highlight after 5 seconds
    setTimeout(() => {
      highlighted.forEach(i => {
        cells[i].classList.remove("highlight");
      });
      canClick = true;
    }, 5000);
  }

  grid.addEventListener("click", (e) => {
    if (!canClick || !e.target.classList.contains("cell")) return;

    const cell = e.target;
    if (cell.classList.contains("correct") || cell.classList.contains("wrong")) return;

    const index = parseInt(cell.dataset.index);

    if (highlighted.includes(index)) {
      cell.classList.add("correct");
      score++;
      highlighted = highlighted.filter(i => i !== index);
    } else {
      cell.classList.add("wrong");
      wrongTaps++;
    }

    updateStats();

    if (wrongTaps > maxWrongTaps) {
      endGame(`💥 Game Over! You made more than ${maxWrongTaps} wrong taps.\n✅ Score: ${score}`);
    } else if (highlighted.length === 0) {
      endGame(`🎉 Great memory!\n✅ Score: ${score}\n❌ Wrong Taps: ${wrongTaps}`);
    }
  });

  startGame();
</script>

</body>
</html>
